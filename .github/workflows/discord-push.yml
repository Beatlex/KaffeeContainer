name: Discord Push Notification

on:
  push:
    branches:
      - main
      - kai_dev_branch
      - leon_dev_branch
      - sebastian_dev_branch
      - marc_dev_branch

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Message
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"☕️ *Frisch gebrühtes Update auf dem Branch \`${{ github.ref_name }}\`!*\n **${{ github.actor }}**: _‘${{ github.event.head_commit.message }}’_\n🔗 https://github.com/${{ github.repository }}\"}" \
               https://discord.com/api/webhooks/1384963640070770708/L3UkaxT-yH1nZPE1_Y2PJU20xS-2Qud0p013NkJizy0WApkHIEVuZOVpcEncJvUVPmSx
