name: Discord Push Notification

on:
  push:
    branches:
      - main  # Oder der Branch, den du überwachen willst
      - Review
      
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Message
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"☕️ *Frisch gebrühtes Update!* 
                     👨‍💻 **${{ github.actor }}** sagt: _‘${{ github.event.head_commit.message }}’_  
                 🔗 [Zum Repo](https://github.com/${{ github.repository }})\"
               }" \                             \
               https://discord.com/api/webhooks/1384963640070770708/L3UkaxT-yH1nZPE1_Y2PJU20xS-2Qud0p013NkJizy0WApkHIEVuZOVpcEncJvUVPmSx

